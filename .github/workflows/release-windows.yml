name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run make:win
      - uses: softprops/action-gh-release@v2
        id: release
        continue-on-error: true
        with:
          generate_release_notes: true
          files: |
            release/Toledo Sync Setup *.exe
      - name: Retry installer upload with GitHub CLI
        if: steps.release.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -Filter 'Toledo Sync Setup *.exe'
          gh release upload "${{ github.ref_name }}" $installer.FullName --clobber --repo "${{ github.repository }}"
      - uses: softprops/action-gh-release@v2
        id: portable-release
        continue-on-error: true
        with:
          files: |
            release/Toledo Sync *.exe
      - name: Retry portable upload with GitHub CLI
        if: steps.portable-release.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $portable = Get-ChildItem release -Filter 'Toledo Sync *.exe' | Where-Object { $_.Name -notlike 'Toledo Sync Setup *' }
          gh release upload "${{ github.ref_name }}" $portable.FullName --clobber --repo "${{ github.repository }}"
