name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run make:win
      - uses: softprops/action-gh-release@v2
        id: release
        continue-on-error: true
        with:
          generate_release_notes: true
          files: |
            release/*.exe
      - name: Retry release asset upload with GitHub CLI
        if: steps.release.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" release/*.exe --clobber --repo "${{ github.repository }}"
